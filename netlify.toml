# Netlify: the site is already built (index.html is generated by tools/build.py and committed),
# so there is no build step; Netlify publishes the repo root as is.
# Every push to main deploys, including the robot's data/ commits, which the site reads.
[build]
  publish = "."
  command = ""

# the robot's data always fresh; photos cached for a day
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
