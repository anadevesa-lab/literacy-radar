name: Atualizacao Diaria

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global user.name 'PaperMint Bot'
          git config --global user.email 'bot@papermint.local'
          date > last_updated.txt
          git add last_updated.txt
          git diff --quiet || (git commit -m 'Update diario' && git push)
